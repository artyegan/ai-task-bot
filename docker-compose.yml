name: ai-task-bot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      start_period: 30s
      start_interval: 1s   # probe every second while starting so dependents start sooner
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Append-only persistence + a volume: queued jobs survive `docker compose down`.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
      timeout: 3s
      retries: 10

  # One-shot: applies Alembic migrations, then exits. No restart policy on purpose;
  # dependents wait for service_completed_successfully.
  migrate:
    build:
      context: ./backend
      target: app
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: app
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      start_period: 30s
      start_interval: 1s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./backend
      target: app
    command: python -m app.bot.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Transcription + notification jobs. The Whisper model is inside the image; the
  # healthcheck passes only after it is loaded, so the first voice note is never slow.
  worker:
    build:
      context: ./backend
      target: worker
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s

  # Dashboard: nginx serving the built SPA and proxying /api and /ws to the api service.
  web:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend tests against real Postgres (separate database) and Redis (separate db index).
  # `make test` runs: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app_test
      REDIS_URL: redis://redis:6379/1
      TRANSCRIBER: fake
      LOG_LEVEL: WARNING
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
