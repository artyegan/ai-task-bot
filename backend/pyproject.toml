[project]
name = "ai-task-bot"
version = "0.1.0"
description = "Omni-channel task management: Telegram bot (text + voice) with a real-time web dashboard"
requires-python = ">=3.12"
# Upper bounds on every runtime dependency: a floating major version (PyAV 19) already
# broke transcription once. Bump deliberately, with the tests.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.3,<3",
    "redis>=5.0,<7",
    "arq>=0.26,<1",
    "aiogram>=3.10,<4",
    "structlog>=24.1,<27",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# av<19: faster-whisper 1.2 still calls av.open(metadata_errors=...), which PyAV 19 removed.
worker = ["faster-whisper>=1.1,<2", "av>=15,<19"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
cache-dir = "/tmp/ruff"
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
